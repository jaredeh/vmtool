---
- name: Commission VM - make cloned image instance-unique
  hosts: all
  become: true
  tasks:

    - name: Set hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Update /etc/hosts with new hostname
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ inventory_hostname }}"

    - name: Reset machine-id
      copy:
        content: ""
        dest: /etc/machine-id

    - name: Generate new machine-id
      command: systemd-machine-id-setup

    - name: Sync dbus machine-id
      file:
        path: /var/lib/dbus/machine-id
        src: /etc/machine-id
        state: link
        force: true

    # Hostname / machine-id / dbus bounce sshd. Drop the dead session and wait.
    - name: Reset SSH connection after identity changes
      meta: reset_connection

    - name: Wait for SSH after identity changes
      wait_for_connection:
        delay: 5
        timeout: 120

    - name: Remove random seed so fresh entropy is generated on boot
      file:
        path: /var/lib/systemd/random-seed
        state: absent

    - name: Clear root bash history
      copy:
        content: ""
        dest: /root/.bash_history

    - name: Clean apt cache
      command: apt-get clean

    # One shot: deleting keys then reconnecting leaves sshd with nothing to offer.
    - name: Replace shared SSH host keys
      shell: rm -f /etc/ssh/ssh_host_* && ssh-keygen -A

    - name: Forget old SSH host key on the control node
      command: ssh-keygen -R {{ ansible_host | default(inventory_hostname) }}
      delegate_to: localhost
      become: false
      failed_when: false
      changed_when: false

    - name: Reboot to apply machine-id and hostname changes
      reboot:
        reboot_timeout: 120
